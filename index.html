<style>
:root{--fs:13px;--pfs:13px;--us:1;
  --uxs:calc(8px * var(--us));
  --us9:calc(9px * var(--us));
  --us10:calc(10px * var(--us));
  --us11:calc(11px * var(--us));
  --us12:calc(12px * var(--us));
  --us13:calc(13px * var(--us));
  /* Theme colors */
  --bg0:#0e0f14;--bg1:#13141a;--bg2:#1a1b24;--border:#2a2d3a;--border2:#3a3d4a;
  --fg:#c8ccd4;--fg2:#5c6370;--fg3:#3a3d4a;--accent:#61afef;--ok:#98c379;--err:#e06c75;--warn:#e5c07b;--purple:#c678dd;--cyan:#56b6c2;--orange:#d19a66;--muted:#abb2bf;
  --diag-bg:#1c1012;--diag-border:#3a2020;
  /* Syntax: block depth colors (hues chosen so neighboring depths never look alike) */
  --cb0:#c678dd;--cb1:#e5c07b;--cb2:#56b6c2;--cb3:#ff7eb6;--cb4:#98c379;--cb5:#f0915a;--cb-chip:22%;
  /* Syntax: type badge backgrounds */
  --badge-plain-bg:#2a3a2a;--badge-jb-bg:#3a2a2a;--badge-persona-bg:#2a2a3a;
  --badge-desc-bg:#2a3a3a;--badge-lore-bg:#3a2a3a;--badge-an-bg:#3a3a2a;
  --warn-syntax-bg:rgba(209,154,102,0.1);--active-bg:rgba(97,175,239,0.16)
}
.light{
  --bg0:#ffffff;--bg1:#f5f6f8;--bg2:#ebedf0;--border:#d0d3da;--border2:#b8bcc5;
  --fg:#1e2028;--fg2:#6b7280;--fg3:#b0b5c0;--accent:#2563eb;--ok:#16a34a;--err:#dc2626;--warn:#d97706;--purple:#7c3aed;--cyan:#0891b2;--orange:#c2410c;--muted:#4b5563;
  --diag-bg:#fef2f2;--diag-border:#fecaca;
  --cb0:#7c3aed;--cb1:#b45309;--cb2:#0891b2;--cb3:#db2777;--cb4:#16a34a;--cb5:#ea580c;--cb-chip:16%;
  --badge-plain-bg:#dcfce7;--badge-jb-bg:#fee2e2;--badge-persona-bg:#dbeafe;
  --badge-desc-bg:#ccfbf1;--badge-lore-bg:#f3e8ff;--badge-an-bg:#fef9c3;
  --warn-syntax-bg:rgba(217,119,6,0.1);--active-bg:rgba(37,99,235,0.13)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--fg);font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--border2)}

.app{display:flex;flex-direction:column;height:100vh;font-size:var(--fs)}
.hdr{display:flex;align-items:center;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);gap:7px;flex-shrink:0;flex-wrap:wrap}
.main{flex:1;display:flex;overflow:hidden}

/* Work area: editor+preview on top, optional drawer on bottom */
.work-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.work-top{flex:1;display:flex;min-height:0;overflow:hidden}
.drawer-hd{height:4px;background:var(--bg2);cursor:row-resize;flex-shrink:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.drawer-hd::after{content:'';width:24px;height:2px;background:var(--border2);border-radius:1px}
.drawer{height:320px;display:flex;flex-direction:column;flex-shrink:0;background:var(--bg1);overflow:hidden}
.drawer-bar{padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.drawer-title{font-size:var(--us10);font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.8px}
.drawer-search{background:var(--bg0);border:1px solid var(--border);color:var(--fg);padding:3px 8px;border-radius:3px;font-family:inherit;font-size:var(--us11);width:280px;outline:none}
.drawer-search:focus{border-color:var(--accent)}
.drawer-body{flex:1;display:flex;overflow:hidden;min-height:0}
.ref-nav{width:220px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);overflow-y:auto;padding:4px 0}
.ref-cat{padding:4px 10px;font-size:var(--us10);font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.ref-cat:first-child{margin-top:0}
.ref-item{padding:3px 14px;font-size:var(--us11);color:var(--fg);cursor:pointer;border-left:2px solid transparent;font-family:'JetBrains Mono',monospace}
.ref-item:hover{background:var(--bg2);color:var(--accent)}
.ref-item.active{background:var(--bg2);color:var(--accent);border-left-color:var(--accent)}
.ref-content{flex:1;overflow-y:auto;padding:12px 18px;font-size:var(--pfs);line-height:1.6}
.ref-content h2{font-family:'JetBrains Mono',monospace;font-size:calc(var(--pfs) + 4px);color:var(--accent);margin:0 0 4px;font-weight:700}
.ref-content .sig{font-family:'JetBrains Mono',monospace;color:var(--fg2);margin-bottom:8px;font-size:calc(var(--pfs) - 1px)}
.ref-content .aliases{color:var(--fg3);font-size:calc(var(--pfs) - 2px);margin-bottom:8px}
.ref-content .aliases code{font-family:'JetBrains Mono',monospace;color:var(--purple)}
.ref-content p{margin:6px 0}
.ref-content .ex-block{margin:10px 0}
.ref-content .ex-label{font-size:calc(var(--pfs) - 2px);color:var(--fg2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.ref-content .ex-code{font-family:'JetBrains Mono',monospace;background:var(--bg0);border:1px solid var(--border);border-radius:3px;padding:6px 10px;font-size:calc(var(--pfs) - 1px);white-space:pre-wrap;color:var(--fg);overflow-x:auto}
.ref-content .ex-out{font-family:'Noto Sans KR','JetBrains Mono',monospace;background:color-mix(in srgb,var(--ok) 8%,transparent);border-left:2px solid var(--ok);padding:4px 10px;font-size:calc(var(--pfs) - 1px);color:var(--fg);margin-top:3px;white-space:pre-wrap;overflow-x:auto}
.ref-content .note-box{background:color-mix(in srgb,var(--warn) 8%,transparent);border-left:2px solid var(--warn);padding:6px 10px;font-size:calc(var(--pfs) - 1px);color:var(--fg);margin:8px 0}
.ref-content code.inline{font-family:'JetBrains Mono',monospace;background:var(--bg2);padding:1px 5px;border-radius:2px;font-size:calc(var(--pfs) - 1px);color:var(--purple)}
.ref-content .related{margin-top:14px;padding-top:8px;border-top:1px solid var(--border);font-size:calc(var(--pfs) - 1px);color:var(--fg2)}
.ref-content .related a{color:var(--accent);text-decoration:none;cursor:pointer;margin-right:8px;font-family:'JetBrains Mono',monospace}
.ref-content .related a:hover{text-decoration:underline}
.ref-empty{color:var(--fg3);padding:20px;text-align:center;font-size:var(--pfs)}
.ref-item .hit{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--fg);padding:0 2px;border-radius:2px}

/* Left panel: prompt nav (top) + control panel tabs (bottom) */
.left{width:260px;display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0;background:var(--bg1);overflow:hidden}
.left.collapsed{width:0;min-width:0;border-right:none;overflow:hidden}
.left-top{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:60px}
.left-top-hdr{padding:5px 8px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:var(--us10);font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0}
.left-top-body{flex:1;overflow-y:auto;padding:4px 6px}

.left-hd{height:4px;background:var(--bg2);cursor:row-resize;flex-shrink:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.left-hd::after{content:'';width:24px;height:2px;background:var(--border2);border-radius:1px}

.left-bot{height:320px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.left-bot .tbar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.left-bot .tcont{flex:1;overflow:auto;background:var(--bg1);padding:8px 10px;font-size:var(--pfs)}

/* Center: editor */
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.ebar{padding:4px 10px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:var(--us11);color:var(--fg2);display:flex;align-items:center;gap:6px;flex-shrink:0}
.ebar .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.ebar .dot.err{background:var(--err)}
.ebar .crumb{color:var(--warn);font-weight:400}
.econtainer{flex:1;position:relative;overflow:hidden}
.etxt,.ehigh{position:absolute;inset:0;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:var(--fs);line-height:1.6;tab-size:2;white-space:pre-wrap;word-wrap:break-word;overflow:auto}
.etxt{background:transparent;color:transparent;caret-color:var(--accent);border:none;resize:none;outline:none;z-index:2}
.ehigh{background:var(--bg1);z-index:1;pointer-events:none}

/* Vertical divider */
.vd{width:4px;background:var(--bg2);cursor:col-resize;flex-shrink:0;border-left:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.vd::after{content:'';width:2px;height:24px;background:var(--border2);border-radius:1px}

/* Right: preview only */
.right{width:420px;display:flex;flex-direction:column;border-left:1px solid var(--border);flex-shrink:0;overflow:hidden}
.right-hdr{padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:var(--us10);font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.right-body{flex:1;overflow:auto;background:var(--bg1)}
.preview{padding:12px 14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;font-family:'Noto Sans KR','JetBrains Mono',sans-serif;font-size:var(--fs)}
.preview-shadow{padding:6px 14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;font-family:'Noto Sans KR','JetBrains Mono',sans-serif;font-size:calc(var(--fs) - 1px);color:var(--fg3);background:var(--bg0)}
.preview-shadow:empty{display:none}
.preview-shadow.before{border-bottom:1px dashed var(--border2)}
.preview-shadow.after{border-top:1px dashed var(--border2)}
.preview-shadow .shadow-lbl{display:block;font-size:calc(var(--us9));text-transform:uppercase;letter-spacing:.5px;color:var(--fg3);margin-bottom:2px;opacity:.8}

/* ===== Components ===== */

<script>
// RPN calculator matching RisuAI's infunctions.ts
function toRPN(expression) {
  let outputQueue = '';
  let operatorStack = [];
  const operators = {
    '+': {p:2, a:'L'}, '-': {p:2, a:'L'}, '*': {p:3, a:'L'}, '/': {p:3, a:'L'},
    '^': {p:4, a:'L'}, '%': {p:3, a:'L'}, '<': {p:1, a:'L'}, '>': {p:1, a:'L'},
    '|': {p:1, a:'L'}, '&': {p:1, a:'L'}, '\u2264': {p:1, a:'L'}, '\u2265': {p:1, a:'L'},
    '=': {p:1, a:'L'}, '\u2260': {p:1, a:'L'}, '!': {p:5, a:'R'}
  };
  const opKeys = Object.keys(operators);
  expression = expression.replace(/\s+/g, '');
  const tokens = [];
  let last = '';
  for (let i = 0; i < expression.length; i++) {
    const c = expression[i];
    if (c === '-' && (i === 0 || opKeys.includes(expression[i-1]) || expression[i-1] === '(')) { last += c; }
    else if (opKeys.includes(c)) { tokens.push(last || '0'); last = ''; tokens.push(c); }
    else { last += c; }
  }
  tokens.push(last || '0');
  tokens.forEach(t => {
    if (parseFloat(t) || t === '0') { outputQueue += t + ' '; }
    else if (opKeys.includes(t)) {
      while (operatorStack.length > 0 &&
        ((operators[t].a === 'L' && operators[t].p <= operators[operatorStack[operatorStack.length-1]].p) ||
         (operators[t].a === 'R' && operators[t].p < operators[operatorStack[operatorStack.length-1]].p))) {
        outputQueue += operatorStack.pop() + ' ';
      }
      operatorStack.push(t);
    }
  });
  while (operatorStack.length > 0) outputQueue += operatorStack.pop() + ' ';
  return outputQueue.trim();
}
function evalRPN(expression) {
  const stack = [];
  expression.split(' ').forEach(t => {
    if (parseFloat(t) || t === '0') { stack.push(parseFloat(t)); }
    else {
      let b = stack.pop() || 0, a = stack.pop() || 0;
      switch (t) {
        case '+': stack.push(a+b); break; case '-': stack.push(a-b); break;
        case '*': stack.push(a*b); break; case '/': stack.push(a/b); break;
        case '^': stack.push(a**b); break; case '%': stack.push(a%b); break;
        case '<': stack.push(a<b?1:0); break; case '>': stack.push(a>b?1:0); break;
        case '|': stack.push(a||b); break; case '&': stack.push(a&&b); break;
        case '\u2264': stack.push(a<=b?1:0); break; case '\u2265': stack.push(a>=b?1:0); break;
        case '=': stack.push(a===b?1:0); break; case '\u2260': stack.push(a!==b?1:0); break;
        case '!': stack.push(b?0:1); break;
      }
    }
  });
  return stack.length ? stack.pop() : 0;
}
function calcString(text) {
  try {
    // Handle parentheses with depth tracking (matching RisuAI)
    const depth = [''];
    for (let i = 0; i < text.length; i++) {
      if (text[i] === '(') { depth.push(''); }
      else if (text[i] === ')' && depth.length > 1) { depth[depth.length-2] += evalRPN(toRPN(depth.pop())); }
      else { depth[depth.length-1] += text[i]; }
    }
    // Normalize operators before RPN conversion
    let expr = depth.join('');
    expr = expr.replace(/&&/g, '&').replace(/\|\|/g, '|')
              .replace(/<=/g, '\u2264').replace(/>=/g, '\u2265')
              .replace(/==/g, '=').replace(/!=/g, '\u2260')
              .replace(/null/gi, '0');
    return evalRPN(toRPN(expr));
  } catch { return 0; }
}
function parseArray(p1) {
  try { const a = JSON.parse(p1); return Array.isArray(a) ? a : p1.split("\u00A7"); }
  catch { return p1.split("\u00A7"); }
}
function makeArray(arr) {
  return JSON.stringify(arr.map(f => typeof f === "string" ? f.replace(/::/g,"\\u003A\\u003A") : f));
}
function isTruthy(s) { return s === "true" || s === "1"; }

function createCBSParser(config) {
  const { charName="Character", userName="User", variables={}, toggles={}, persona="", rngSeed=null } = config;
  const vars = { ...variables };

  function matcher(p1, tv) {

  function blockStartMatcher(p1) {
    if(p1.startsWith("#if")||p1.startsWith("#if_pure ")) {
      const st=p1.split(" ",2)[1];
      if(st==="true"||st==="1") return {type:p1.startsWith("#if_pure")?"ifpure":"parse"};
      return {type:"ignore"};
    }
    if(p1.startsWith("#when")) {
      if(p1.startsWith("#when ")) { const st=p1.split(" ",2)[1]; return {type:(st==="true"||st==="1")?"newif":"newif-falsy"}; }
      if(p1.startsWith("#when::")) {
        const st=p1.split("::").slice(1);
        if(st.length===1) return {type:(st[0]==="true"||st[0]==="1")?"newif":"newif-falsy"};
        let mode="normal";
        while(st.length>1) {
          const cond=st.pop(),op=st.pop();
          switch(op) {
            case "not": st.push(isTruthy(cond)?"0":"1"); break;
            case "keep": mode="keep"; st.push(cond); break;
            case "legacy": mode="legacy"; st.push(cond); break;
            case "and": {const c2=st.pop(); st.push((isTruthy(cond)&&isTruthy(c2))?"1":"0"); break;}
            case "or": {const c2=st.pop(); st.push((isTruthy(cond)||isTruthy(c2))?"1":"0"); break;}
            case "is": {const c2=st.pop(); st.push(cond===c2?"1":"0"); break;}
            case "isnot": {const c2=st.pop(); st.push(cond!==c2?"1":"0"); break;}
            case "var": st.push(isTruthy(gv(cond))?"1":"0"); break;
            case "toggle": st.push(isTruthy(gt(cond))?"1":"0"); break;
            case "vis": {const vn=st.pop(); st.push(gv(vn)===cond?"1":"0"); break;}
            case "visnot": {const vn=st.pop(); st.push(gv(vn)!==cond?"1":"0"); break;}
            case "tis": {const tn=st.pop(); st.push(gt(tn)===cond?"1":"0"); break;}
            case "tisnot": {const tn=st.pop(); st.push(gt(tn)!==cond?"1":"0"); break;}
            case ">": {const c2=st.pop(); st.push(parseFloat(c2)>parseFloat(cond)?"1":"0"); break;}
            case "<": {const c2=st.pop(); st.push(parseFloat(c2)<parseFloat(cond)?"1":"0"); break;}
            case ">=": {const c2=st.pop(); st.push(parseFloat(c2)>=parseFloat(cond)?"1":"0"); break;}
            case "<=": {const c2=st.pop(); st.push(parseFloat(c2)<=parseFloat(cond)?"1":"0"); break;}
            default: st.push(isTruthy(cond)?"1":"0"); break;
          }
        }
        const fc=st[0];
        if(isTruthy(fc)) return mode==="keep"?{type:"newif",type2:"keep"}:mode==="legacy"?{type:"parse"}:{type:"newif"};
        return mode==="keep"?{type:"newif-falsy",type2:"keep"}:mode==="legacy"?{type:"ignore"}:{type:"newif-falsy"};
      }
      return {type:"newif-falsy"};
    }
    if(p1==="#pure") return {type:"pure"};
    if(p1==="#pure_display"||p1==="#puredisplay") return {type:"pure-display"};
    if(p1==="#code") return {type:"normalize"};
    if(p1.startsWith("#escape")) return {type:"escape",mode:p1.substring(7).trim()==="::keep"?"keep":undefined};
    if(p1.startsWith("#each")) { let t2=p1.substring(5).trim(),mode; if(t2.startsWith("::keep ")){mode="keep";t2=t2.substring(7).trim();} if(t2.startsWith("as "))t2=t2.substring(3).trim(); return {type:"each",type2:t2,mode}; }

  function trimLines(p) { return p.split("\n").map(v=>v.trimStart()).join("\n").trim(); }

  function blockEndMatcher(p1,type) {
    const pt=p1.trim();

      case "pure": case "pure-display": case "function": return pt;

  function parse(da,callStack=0) {
    if(callStack>20) return "ERROR: Call stack limit reached";
    let ptr=0, nested=[""], stk=new Array(512).fill(0), pm=new Map(), bnt=new Map(), tv={}, fns=new Map();
    da=da.replace(/<(user|char|bot)>/gi,"{{$1}}");
    const isPM=()=>pm.size>0;
    while(ptr<da.length) {
      switch(da[ptr]) {
        case "{": { if(da[ptr+1]!=="{"&&da[ptr+1]!=="#"){nested[0]+=da[ptr];break;} ptr++; nested.unshift(""); stk[nested.length]=1; break; }
        case "}": {
          if(da[ptr+1]!=="}"||nested.length===1||stk[nested.length]!==1){nested[0]+=da[ptr];break;}
          ptr++; const dat=nested.shift();
          if(dat.startsWith("#")||dat.startsWith(":")) {
            if(isPM()){nested[0]+=`{{${dat}}}`;if(dat!==":else"){nested.unshift("");stk[nested.length]=6;}break;}
            const mr=blockStartMatcher(dat);
            if(mr.type==="nothing"){nested[0]+=`{{${dat}}}`;break;}
            nested.unshift(""); stk[nested.length]=5; bnt.set(nested.length,mr);
            if(["ignore","pure","each","function","pure-display","escape"].includes(mr.type)) pm.set(nested.length,true);
            break;
          }
          if(dat.startsWith("/")&&!dat.startsWith("//")) {
            if(stk[nested.length]===5) {
              const bt=bnt.get(nested.length);
              if(["ignore","pure","each","function","pure-display","escape"].includes(bt.type)) pm.delete(nested.length);
              bnt.delete(nested.length);
              const d2=nested.shift(), mr=blockEndMatcher(d2,bt);
              if(bt.type==="each") {
                const ai=bt.type2.lastIndexOf(" as ");
                let sub=bt.type2.substring(ai+4).trim(), arr=parseArray(bt.type2.substring(0,ai));
                if(ai===-1){const si=bt.type2.lastIndexOf(" ");if(si===-1)break;sub=bt.type2.substring(si+1);arr=parseArray(bt.type2.substring(0,si));}
                let added=""; for(let i=0;i<arr.length;i++) added+=mr.replaceAll(`{{slot::${sub}}}`,typeof arr[i]==="string"?arr[i]:JSON.stringify(arr[i]));
                da=da.substring(0,ptr+1)+(bt.mode==="keep"?added:added.trim())+da.substring(ptr+1); break;
              }
              if(bt.type==="function"){fns.set(bt.funcArg[0],{data:mr,arg:bt.funcArg.slice(1)});break;}
              if(bt.type==="pure-display"){nested[0]+=mr.replaceAll("{{","\\{\\{").replaceAll("}}","\\}\\}");break;}
              if(mr==="")break; nested[0]+=mr; break;
            }
            if(stk[nested.length]===6){const sf=nested.shift();nested[0]+=sf+`{{${dat}}}`;break;}
          }
          if(dat.startsWith("call::")) {
            if(callStack>20){nested[0]+="ERROR: Call stack limit";break;}
            const ad=dat.split("::").slice(1),fn=fns.get(ad[0]);
            if(fn){let d=fn.data;for(let i=0;i<ad.length;i++)d=d.replaceAll(`{{arg::${i}}}`,ad[i]);nested[0]+=parse(d,callStack+1);break;}
          }
          const mc=isPM()?null:matcher(dat,tv);
          if(!mc&&mc!==""){nested[0]+=`{{${dat}}}`;}
          else if(typeof mc==="string"){nested[0]+=mc;}
          else{nested[0]+=mc.text;tv=mc.var;}
          break;
        }
        default: { nested[0]+=da[ptr]; break; }
      }
      ptr++;
    }
    if(nested.length===1) return nested[0];
    let r=""; while(nested.length>1){let d=stk[nested.length]===1?"{{":"<";d+=nested.shift();r=d+r;} return nested[0]+r;
  }
  return {parse,vars};
}

// Block tags that open a new depth level
const BLOCK_OPEN = /^#(if|if_pure|when|each|pure|puredisplay|pure_display|code|escape|func)\b/;
const BLOCK_CLOSE = /^\//;
const BLOCK_MID = /^:else$/;
const DEPTH_COLORS = ['cb0','cb1','cb2','cb3','cb4','cb5'];
// CBS-like keywords that suggest a single { was meant to be {{
const CBS_KEYWORDS = /^(#if|#when|#each|#pure|#func|#escape|#code|\/if|\/when|\/each|\/pure|\/func|\/escape|\/code|:else|char|bot|user|persona|getvar|setvar|getglobalvar|addvar|calc|random|print|slot|comment|\/\/)/;

// Determine which plain-text runs in the template are "active" (survive parsing)
// given the current variables/toggles/seed. Uses unique sentinels around each plain
// run and a single real parse, so side effects (setvar/settempvar) and randomness
// are handled exactly as the preview would, with rolls fixed to the current seed.
function analyzeActiveRuns(template, cfg){
  const OPEN='\u0001', CLOSE='\u0002', SEP='\u0003';
  const runs=[];
  let injected='', i=0;
  while(i<template.length){
    if(template[i]==='{'&&template[i+1]==='{'){
      let j=i+2, depth=1;
      while(j<template.length-1&&depth>0){
        if(template[j]==='{'&&template[j+1]==='{'){depth++;j+=2;}
        else if(template[j]==='}'&&template[j+1]==='}'){depth--;j+=2;}
        else j++;
      }
      if(depth>0)j=template.length;
      injected+=template.substring(i,j);
      i=j;
    }else{
      let e=i;
      while(e<template.length&&!(template[e]==='{'&&template[e+1]==='{'))e++;
      if(e>i){
        const id=runs.length;
        runs.push({start:i,end:e});
        injected+=OPEN+id+SEP+template.substring(i,e)+CLOSE;
      }
      i=e;
    }
  }
  let out;
  try{ out=createCBSParser(cfg).parse(injected); }
  catch(err){ return null; }
  const active=new Set();
  // eslint-disable-next-line no-control-regex
  const re=new RegExp(OPEN+'(\\d+)'+SEP,'g');
  let m; while((m=re.exec(out))!==null) active.add(parseInt(m[1]));
  // Build a per-character active flag over the source
  const flags=new Uint8Array(template.length);
  runs.forEach((r,id)=>{ if(active.has(id)) for(let k=r.start;k<r.end;k++) flags[k]=1; });
  return flags;
}

// Innermost block whose tags enclose the caret (caret strictly inside the open..close span).
function findActiveBlock(blocks, caret) {
  let best = null;
  for (const b of blocks) if (b.start < caret && caret < b.cEnd && (!best || b.start > best.start)) best = b;
  return best;
}

function highlightCBS(text, activeFlags, caret) {
  const parts = []; let i = 0;
  let blockDepth = 0;
  const openStack = [];
  // Closed blocks with source ranges and the parts[] index of each tag (for caret emphasis)
  const blocks = [];
  // Track alternating index per depth level
  const depthCounter = {};
  let lineNum = 1;

  while (i < text.length) {
    if (text[i] === '{' && text[i+1] === '{') {
      // Find matching }}
      let j = i + 2, depth = 1;
      while (j < text.length - 1 && depth > 0) {
        if (text[j] === '{' && text[j+1] === '{') { depth++; j += 2; }
        else if (text[j] === '}' && text[j+1] === '}') { depth--; j += 2; }
        else j++;
      }
      if (depth > 0) j = text.length;
      const expr = text.substring(i, j);
      const inner = expr.length >= 4 ? expr.substring(2, expr.length - 2) : '';

      let cls = 'ce';
      if (BLOCK_OPEN.test(inner)) {
        // Get alternating shade for this depth
        if (!depthCounter[blockDepth]) depthCounter[blockDepth] = 0;
        const alt = depthCounter[blockDepth] % 2 === 1 ? 'a' : '';
        cls = DEPTH_COLORS[blockDepth % DEPTH_COLORS.length] + alt;
        openStack.push({ tag: inner.split(/[\s:]/)[0], line: lineNum, depth: blockDepth, alt: alt, cls: cls, start: i, end: j, part: parts.length, mids: [] });
        depthCounter[blockDepth]++;
        blockDepth++;
      } else if (BLOCK_CLOSE.test(inner) && !inner.startsWith('//')) {
        blockDepth = Math.max(0, blockDepth - 1);
        if (openStack.length > 0) {
          const matched = openStack.pop();
          cls = matched.cls;
          blocks.push(Object.assign(matched, { cStart: i, cEnd: j, cPart: parts.length }));
        } else {
          cls = 'cb-err';
        }
      } else if (BLOCK_MID.test(inner)) {
        const top = openStack[openStack.length-1];
        cls = top ? top.cls : 'cb0';
        if (top) top.mids.push({ start: i, end: j, part: parts.length });
      } else if (inner.startsWith('setvar') || inner.startsWith('getvar') || inner.startsWith('getglobalvar') || inner.startsWith('addvar') || inner.startsWith('settempvar') || inner.startsWith('tempvar') || inner.startsWith('setdefault') || inner.startsWith('slot')) {
        cls = 'cv';
      } else if (inner.startsWith('calc') || inner.startsWith('? ') || inner.startsWith('round') || inner.startsWith('floor') || inner.startsWith('ceil') || inner.startsWith('greater') || inner.startsWith('less') || inner.startsWith('equal') || inner.startsWith('notequal')) {
        cls = 'cm';
      } else if (inner === 'char' || inner === 'bot' || inner === 'user' || inner === 'persona') {
        cls = 'cn';
      } else if (inner.startsWith('//') || inner.startsWith('comment')) {

      parts.push('<span class="' + cls + '">' + escH(expr) + '</span>');

      let e = i;
      // Emit a plain substring [from,to), splitting into active/inactive spans.
      const emitPlain = (from, to) => {

        if (!activeFlags) { parts.push(escH(text.substring(from, to))); return; }
        let segStart = from, cur = activeFlags[from] === 1;
        for (let p = from + 1; p <= to; p++) {
          const act = p < to ? (activeFlags[p] === 1) : !cur;
          if (p === to || act !== cur) {
            const chunk = escH(text.substring(segStart, p));
            parts.push(cur ? '<span class="ca">' + chunk + '</span>' : chunk);
            segStart = p; cur = act;
          }
        }
      };
      let runStart = i;
      while (e < text.length && text[e] !== '\n') {
        if (text[e] === '{' && text[e+1] === '{') break;

        // Check for lone }} (missing opening {{)
        if (text[e] === '}' && text[e+1] === '}') {

          e += 2;

        if (text[e] === '{' && text[e+1] !== '{') {
          const ahead = text.substring(e + 1, Math.min(e + 20, text.length));
          if (CBS_KEYWORDS.test(ahead)) {

            if (te < text.length && text[te] === '}') te++;

            e = te; runStart = te;
            continue;
          }
        }

        e++;
      }
      emitPlain(runStart, e);
      if (e === i) { parts.push(escH(text[i])); i++; }
      else i = e;

  highlightCBS._diag = openStack.map(b => ({ tag: b.tag, line: b.line }));
  // Unclosed blocks run to the end of the text
  openStack.forEach(b => blocks.push(Object.assign(b, { cStart: -1, cEnd: text.length + 1, cPart: -1 })));

  const ab = caret == null ? null : findActiveBlock(blocks, caret);

  if (ab) {

    const tag = (s, e) => '<span class="' + ab.cls + ' cbs-cur">' + escH(text.substring(s, e)) + '</span>';
    const mk = w => '<span class="blk-mk" data-mk="' + w + '"></span>';
    parts[ab.part] = mk('s') + tag(ab.start, ab.end);
    ab.mids.forEach(m => { parts[m.part] = tag(m.start, m.end); });

const RPACK_MAP_B64 = "xA0eC70rP1X8RW71ZlNPGuC7MJSGumu/QVBvm+/etxBhFyDfMomonW2ryZAADF2v0sFW5RZkkYJldJfKI9ZS0f+0oOgvilg4WmAZlknb18g7PkNLpWNHqmopkvQVz2I0eNMdPOIFjipXDhvNTC3yQCwleUgPsnq1p2w35px7VH7+h9yaAuQzouuxLgPdmaaw59WIGIN89r7hXJ/DIUYfCE7QdhJf7v2PROqjXosoCTWeacwKx4UHrUrzd+ln1NqEgJO2TXP6JyZ/BMb78XI5UcI2qWis+O3FucvOdaQ9gdlCcByVEbzYjJj5WaET9xR9s+xxwOON8AGuWzEGJCI6uCz3hIvJZfu2n66zAy0BaXQf5KPs7lw0IZNKD2riYgKeIpz9PPxxx8atWWcFcG2KRBL6JIZfr9F6R87+UGPdUQZvGOBSqAmdVnNMuFNsw6AOGc8+DX4HMmhG6kj5mS6rpEkgXlU1OAy807FYFnkoChrh8s3EOduiumBydn2V73/IwN43lL+1FIGSJUWs5/Vmpys2WsET40s66I2DG3wnsJpC64eq3FSOeCbSVynUt/gvj4l18EF3wh7/2BUR5QSXF/Mx0JsA18q0Tyo72bJr2l2hPzBhvZE9Tubfvk2CjB0jEJhk9IUze5BDu6mI8dalHPbMbrlbC5bt1enFywimgEA=";
let rpackEncode = null, rpackDecode = null;
function initRPack() {
  if (rpackEncode) return;
  const bin = Uint8Array.from(atob(RPACK_MAP_B64), c => c.charCodeAt(0));
  rpackEncode = bin.slice(0, 256);
  rpackDecode = bin.slice(256, 512);
}
function rpackEncodeData(data) {
  initRPack();
  const r = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) r[i] = rpackEncode[data[i]];
  return r;
}
function rpackDecodeData(data) {
  initRPack();
  const r = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) r[i] = rpackDecode[data[i]];
  return r;
}

// ============================================================
// AES-GCM encrypt/decrypt (matching RisuAI's encryptBuffer/decryptBuffer)
// ============================================================
async function risuEncrypt(data, keyStr) {
  const keyHash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(keyStr));
  const key = await crypto.subtle.importKey("raw", keyHash, "AES-GCM", false, ["encrypt"]);
  const result = await crypto.subtle.encrypt({ name: "AES-GCM", iv: new Uint8Array(12) }, key, data);
  return new Uint8Array(result);
}
async function risuDecrypt(data, keyStr) {
  const keyHash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(keyStr));
  const key = await crypto.subtle.importKey("raw", keyHash, "AES-GCM", false, ["decrypt"]);
  const result = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(12) }, key, data);
  return new Uint8Array(result);
}

// ============================================================
// Preset Import/Export
// ============================================================
async function importRisuPreset(arrayBuf, fileName) {
  let data = new Uint8Array(arrayBuf);
  fileName = fileName.toLowerCase();

  // .risup: rpack decode first
  if (fileName.endsWith('.risup')) {
    data = rpackDecodeData(data);
  }

  if (fileName.endsWith('.json') || fileName.endsWith('.preset')) {
    // Plain JSON
    const text = new TextDecoder().decode(data);
    return JSON.parse(text);
  }

  // .risupreset or .risup: fflate decompress -> msgpack decode -> decrypt -> msgpack decode
  const decompressed = fflate.decompressSync(data);
  const outer = MessagePack.decode(decompressed);

  if ((outer.presetVersion === 0 || outer.presetVersion === 2) && outer.type === 'preset') {
    const encryptedData = outer.preset ?? outer.pres;
    const decrypted = await risuDecrypt(encryptedData, 'risupreset');
    const preset = MessagePack.decode(decrypted);
    return preset;
  }

  throw new Error("Unknown preset format (version: " + outer.presetVersion + ")");
}

async function exportRisuPreset(preset) {
  // .risup format: msgpack encode -> encrypt -> msgpack encode outer -> fflate compress -> rpack encode
  const innerPacked = MessagePack.encode(preset);
  const encrypted = await risuEncrypt(innerPacked, 'risupreset');
  const outerObj = { presetVersion: 2, type: 'preset', preset: encrypted };
  const outerPacked = MessagePack.encode(outerObj);
  const compressed = fflate.compressSync(outerPacked);
  const rpacked = rpackEncodeData(compressed);
  return { data: rpacked, ext: '.risup' };
}

function downloadBlob(data, filename) {
  const blob = new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseControlPanel(text) {
  if (!text) return [];
  const items = [];
  const warnings = [];
  let currentGroup = null;
  let lineNum = 0;
  for (const line of text.split('\n')) {
    lineNum++;
    if (!line.trim()) continue;
    const [key, value, type, option] = line.split('=');
    // Group start (RisuAI: type === 'group', strict)
    if (type === 'group') {
      if (currentGroup) {
        warnings.push({line: lineNum, msg: 'New group "'+(value||key||'')+'" opened while previous group "'+currentGroup.label+'" was still open. RisuAI auto-closes the previous group here.'});
        items.push(currentGroup);
      }
      currentGroup = { type: 'group', label: value || key || '', items: [] };
      continue;
    }
    // Group end (RisuAI: type === 'groupEnd', strict, case-sensitive)
    if (type === 'groupEnd') {
      if (currentGroup) { items.push(currentGroup); currentGroup = null; }
      else warnings.push({line: lineNum, msg: 'groupEnd without a matching open group.'});
      continue;
    }
    // Common typo: lowercase groupend (won't work in RisuAI)
    if (type && type.toLowerCase() === 'groupend' && type !== 'groupEnd') {
      warnings.push({line: lineNum, msg: '"'+type+'" is not recognized in RisuAI. Use "groupEnd" (capital E).'});
      // Skip silently to match RisuAI (which treats this as just a malformed line)
      continue;
    }
    // Divider
    if (type === 'divider') {
      const item = { type: 'divider', label: value || '' };
      if (currentGroup) currentGroup.items.push(item); else items.push(item);
      continue;
    }
    // Caption
    if (type === 'caption' && value) {
      const item = { type: 'caption', label: value };
      if (currentGroup) currentGroup.items.push(item); else items.push(item);
      continue;
    }
    // Need both key and value for select/text/textarea/toggle (matches RisuAI's `if(key && value)`)
    if (!key || !value) continue;
    if (type === 'select') {
      const options = (option || '').split(',').map(o => o.trim());
      const item = { type: 'select', varname: key, label: value, options };
      if (currentGroup) currentGroup.items.push(item); else items.push(item);
    } else if (type === 'text' || type === 'textarea') {
      const item = { type: 'text', varname: key, label: value };
      if (currentGroup) currentGroup.items.push(item); else items.push(item);
    } else {
      const item = { type: 'toggle', varname: key, label: value };
      if (currentGroup) currentGroup.items.push(item); else items.push(item);
    }
  }
  if (currentGroup) {
    warnings.push({line: lineNum, msg: 'Group "'+currentGroup.label+'" is never closed with groupEnd.'});
    items.push(currentGroup);
  }
  items._warnings = warnings;
  return items;
}
function flattenPanelItems(parsed) {
  const flat = [];
  for (const item of parsed) {
    if (item.type === 'group') { for (const sub of item.items) { if (sub.type==='select'||sub.type==='toggle'||sub.type==='text') flat.push(sub); } }
    else if (item.type==='select'||item.type==='toggle'||item.type==='text') flat.push(item);
  }
  return flat;
}

// Show a "shadow" of the previous item's tail and next item's head around the preview,
// so authors can see how items will join when RisuAI reconstructs the request.
function renderPreviewContext(){
  const before=_('prevBefore'), after=_('prevAfter');
  if(!S.showShadow || S.mode!=='prompt' || S.activeIdx<0 || !S.promptTemplate.length){
    before.innerHTML=''; after.innerHTML=''; return;
  }
  const TAIL=240, HEAD=240;
  // Previous neighbor tail
  const pi=neighborIdx(S.activeIdx,-1);
  if(pi>=0){
    const it=S.promptTemplate[pi];
    let txt = isEd(it)?parseItemText(itText(it)):('['+pLabel(it)+']');
    txt=txt.replace(/\s+$/,'');
    const tail=txt.length>TAIL?'\u2026'+txt.slice(-TAIL):txt;
    before.innerHTML='<span class="shadow-lbl">\u2191 prev: '+escH(pLabel(it))+'</span>'+escH(tail);
  } else before.innerHTML='';
  // Next neighbor head
  const ni=neighborIdx(S.activeIdx,1);
  if(ni>=0){
    const it=S.promptTemplate[ni];
    let txt = isEd(it)?parseItemText(itText(it)):('['+pLabel(it)+']');
    txt=txt.replace(/^\s+/,'');
    const head=txt.length>HEAD?txt.slice(0,HEAD)+'\u2026':txt;
    after.innerHTML='<span class="shadow-lbl">\u2193 next: '+escH(pLabel(it))+'</span>'+escH(head);

// Thin box around the block enclosing the caret, positioned from the markers highlightCBS emits.

  const s=hl.querySelector('[data-mk="s"]'),e=hl.querySelector('[data-mk="e"]');if(!s||!e)return;

function loadPreset(pr){
  S.dirty=false;
  S.preset=pr;S.presetName=pr.name||'Unnamed';
  S.promptTemplate=pr.promptTemplate||[];S.manualVars=[];
  S.panelValues={};applyPanel(pr.customPromptTemplateToggle||'');
  if(pr.templateDefaultVariables){
    for(const ln of pr.templateDefaultVariables.trim().split('\n')){
      const eq=ln.indexOf('=');if(eq===-1)continue;
      const k=ln.substring(0,eq).trim(),v=ln.substring(eq+1).trim();
      if(S.panelValues.hasOwnProperty(k))S.panelValues[k]=v;
      else S.manualVars.push({key:k,value:v});
    }
  }
  S.activeIdx=-1;S.activeField=null;
  if(S.promptTemplate.length>0){
    const i=S.promptTemplate.findIndex(p=>isEd(p)&&itFields(p).some(f=>p[f]&&p[f].length>0));
    if(i!==-1){S.activeIdx=i;S.activeField=itFields(S.promptTemplate[i])[0];ed.value=itText(S.promptTemplate[i],S.activeField);S.mode='prompt';}
  }
  if(S.activeIdx===-1){ed.value=pr.mainPrompt||'';S.mode='free';}
  crumb();update();renderNav();
  if(S.bTab==='panel')renderPanel();
  if(S.bTab==='vars')renderVars();
  toast('Loaded: '+S.presetName);
}

function buildExport(){
  saveEdit();const p=S.preset?{...S.preset}:{};
  p.name=S.presetName||'CBS Export';
  if(S.promptTemplate.length>0)p.promptTemplate=S.promptTemplate;
  // Write back even when cleared, so emptying the panel removes the toggles
  if(S.panelText||'customPromptTemplateToggle' in p)p.customPromptTemplateToggle=S.panelText;
  return p;
}

function flattenPreset(){
  saveEdit();
  const parts=[];
  if(S.panelText&&S.panelText.trim()){
    parts.push(FLAT_TOGGLES+'\n'+S.panelText.trim());
  }
  if(!S.promptTemplate.length){parts.push(FLAT_PROMPT+'\n'+ed.value);return parts.join('\n\n');}
  S.promptTemplate.forEach((it,i)=>{
    const baseLabel='['+i+'] '+it.type.toUpperCase()+(it.type2?' ('+it.type2+')':'')+(it.role?' ['+it.role+']':'')+(it.name?' "'+it.name+'"':'');
    if(isEd(it)){
      const fs=itFields(it);
      const populated=fs.filter(f=>it[f]&&it[f].length>0);
      if(populated.length===0){
        parts.push('--- '+baseLabel+' ---\n['+pLabel(it)+']');
      }else{
        populated.forEach(f=>{
          const suffix=fs.length>1?' ('+f+')':'';
          parts.push('--- '+baseLabel+suffix+' ---\n'+it[f]);
        });
      }
    }else{
      parts.push('--- '+baseLabel+' ---\n['+pLabel(it)+']');
    }
  });
  return parts.join('\n\n');
}

// ============================================================
// Flat import: turn a Flatten .txt (possibly edited elsewhere) back into the preset
// ============================================================
const FLAT_TOGGLES='=== CUSTOM TOGGLES ===', FLAT_PROMPT='=== PROMPT ===';
// Mirrors the label built in flattenPreset: [i] TYPE (type2) [role] "name" (field)
const FLAT_HDR=/^--- \[(\d+)\] ([A-Za-z0-9_]+)(?: \(([^)]*)\))?(?: \[([^\]]*)\])?(?: "(.*)")?(?: \((text|innerFormat|defaultText)\))? ---$/;
// Flatten upper-cases the type; map it back to RisuAI's casing
const KNOWN_TYPES=['plain','jailbreak','cot','chatML','persona','description','lorebook','postEverything','memory','authornote','chat','cache'];

function parseFlat(txt){
  const lines=txt.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n');
  const buckets=[];let cur={kind:'pre',lines:[]};
  const flush=()=>{buckets.push(cur);};
  for(const ln of lines){
    const m=FLAT_HDR.exec(ln);
    if(m){
      flush();
      const type=KNOWN_TYPES.find(t=>t.toLowerCase()===m[2].toLowerCase())||m[2].toLowerCase();
      let type2=m[3],field=m[6];
      // "(innerFormat)" on a multi-field item with no type2 lands in the type2 slot
      if(!field&&type==='authornote'&&/^(innerFormat|defaultText)$/.test(type2||'')&&m[4]==null&&m[5]==null){field=type2;type2=undefined;}
      cur={kind:'item',idx:parseInt(m[1]),type,type2,role:m[4],name:m[5],field,lines:[]};
    }else if(!buckets.some(b=>b.kind==='item')&&cur.kind!=='item'&&(ln.trim()===FLAT_TOGGLES||ln.trim()===FLAT_PROMPT)){
      flush();cur={kind:ln.trim()===FLAT_TOGGLES?'toggles':'prompt',lines:[]};
    }else cur.lines.push(ln);
  }
  flush();
  // Sections are joined with a blank line; drop it from each body
  buckets.forEach(b=>{if(b.lines.length&&b.lines[b.lines.length-1]==='')b.lines.pop();b.body=b.lines.join('\n');});
  const res={panel:null,prompt:null,items:[]};
  for(const b of buckets){
    if(b.kind==='toggles')res.panel=b.body;
    else if(b.kind==='prompt')res.prompt=b.body;
    else if(b.kind==='item'){
      // Consecutive sections of one item (e.g. Author Note innerFormat + defaultText) merge
      const last=res.items[res.items.length-1];
      if(last&&last.idx===b.idx&&last.type===b.type&&last.name===b.name&&b.field&&!(b.field in last.fields)){last.fields[b.field]=b.body;continue;}
      res.items.push({idx:b.idx,type:b.type,type2:b.type2,role:b.role,name:b.name,fields:{[b.field||'']:b.body}});
    }
  }
  const pre=buckets.find(b=>b.kind==='pre');
  if(!res.items.length&&res.prompt==null){
    // Older flatten files have no PROMPT header: free text follows the toggles after a blank line
    if(res.panel!=null&&!pre.body.trim()){
      const k=res.panel.indexOf('\n\n');
      if(k!==-1){res.prompt=res.panel.substring(k+2);res.panel=res.panel.substring(0,k);}
    }else if(pre.body.trim())res.prompt=pre.body;
  }
  return res;
}

function newFlatItem(g){
  const it={type:g.type};
  if(g.type2)it.type2=g.type2;else if(g.type==='plain')it.type2='normal';
  if(g.role)it.role=g.role;else if(['plain','jailbreak','cot'].includes(g.type))it.role='system';
  if(g.name)it.name=g.name;
  if(g.type==='chat'){
    const m=/^\[Chat \[(-?\d*)~(-?\d*)\]\]$/.exec((g.fields['']||'').trim());
    it.rangeStart=m&&m[1]!==''?parseInt(m[1]):0;it.rangeEnd=m&&m[2]!==''?parseInt(m[2]):'end';
  }
  return it;
}

function importFlat(txt,fileName){
  saveEdit();
  const fp=parseFlat(txt);
  if(!fp.items.length&&fp.prompt==null&&fp.panel==null)throw new Error('No flattened content found');
  const orig=S.promptTemplate,used=new Map(),out=[];
  let upd=0,add=0;
  const sameKind=(o,g)=>o.type===g.type&&(o.type2||'')===(g.type2||'');
  for(const g of fp.items){
    // Match by index first, then by type+name, so reordered or renamed sections still find their source
    let k=g.idx<orig.length&&!used.has(g.idx)&&sameKind(orig[g.idx],g)?g.idx:-1;
    if(k<0)k=orig.findIndex((o,i)=>!used.has(i)&&sameKind(o,g)&&(o.name||'')===(g.name||''));
    const src=k>=0?orig[k]:null,it=src?{...src}:newFlatItem(g);
    if(src)used.set(k,out.length);
    let changed=false;
    if(isEd(it)){
      const fs=itFields(it),placeholder='['+pLabel(src||it)+']';
      for(const[f,body]of Object.entries(g.fields)){
        const field=f||fs[0];if(!fs.includes(field))continue;
        const old=it[field]||'';
        if(!old&&body.trim()===placeholder)continue;
        // Trailing whitespace is ambiguous after the blank-line join; keep the original when that's all that differs
        if(body.trimEnd()===old.trimEnd())continue;
        it[field]=body;changed=true;
      }
    }
    if(src){
      if(g.name&&g.name!==src.name){it.name=g.name;changed=true;}
      if(g.role&&g.role!==src.role){it.role=g.role;changed=true;}
      if(changed)upd++;
    }else add++;
    out.push(it);
  }
  const removed=orig.length-used.size;
  // used is keyed in output order, so any decreasing original index means a reorder
  const moved=[...used.keys()].some((k,n,a)=>n>0&&a[n-1]>k);
  const panelChanged=fp.panel!=null&&fp.panel.trim()!==(S.panelText||'').trim();
  const promptChanged=fp.prompt!=null&&!fp.items.length&&fp.prompt!==ed.value;

  if(!S.preset){
    // Nothing loaded: build a minimal preset from the flat file alone
    const pr={name:fileName.replace(/\.txt$/i,'').replace(/_flat$/,'')||'Flat Import'};
    if(out.length)pr.promptTemplate=out;
    if(fp.panel!=null)pr.customPromptTemplateToggle=fp.panel;
    if(!out.length&&fp.prompt!=null)pr.mainPrompt=fp.prompt;
    if(confirmDiscard(pr.name))loadPreset(pr);
    return;
  }

  if(!upd&&!add&&!removed&&!moved&&!panelChanged&&!promptChanged){toast('No changes found in '+fileName);return;}
  const summary=[];
  if(fp.items.length){
    summary.push(upd+' item(s) updated',add+' added',removed+' removed');
    if(moved)summary.push('order changed');
  }
  if(promptChanged)summary.push('editor text replaced');
  if(panelChanged)summary.push('custom toggles replaced');
  const warnRm=removed?'\n\n'+removed+' item(s) in the current preset are missing from the file and will be removed.':'';
  if(!confirm('Apply "'+fileName+'" to "'+S.presetName+'"?\n\n'+summary.join(', ')+'.'+warnRm))return;

  const activeTo=S.activeIdx>=0&&used.has(S.activeIdx)?used.get(S.activeIdx):-1;
  if(fp.items.length){S.promptTemplate=out;S.preset.promptTemplate=out;}
  if(panelChanged)applyPanel(fp.panel);
  if(promptChanged){S.mode='free';S.activeIdx=-1;ed.value=fp.prompt;S.preset.mainPrompt=fp.prompt;}
  else if(fp.items.length){
    S.activeIdx=activeTo>=0?activeTo:S.promptTemplate.findIndex(p=>isEd(p));
    if(S.activeIdx>=0){
      const it=S.promptTemplate[S.activeIdx];
      if(!itFields(it).includes(S.activeField))S.activeField=itFields(it)[0];
      S.mode='prompt';ed.value=itText(it,S.activeField);
    }else S.mode='free';
  }
  crumb();update();renderNav();
  if(S.bTab==='panel')renderPanel();
  markDirty();
  toast('Applied flat file: '+summary.join(', '));
}

// Build the full reconstructed prompt: every editable item parsed and joined,
// in template order, with no labels or indicators (how RisuAI assembles the request).
function buildReconstructed(){
  saveEdit();
  if(!S.promptTemplate.length) return parseItemText(ed.value);
  const parts=[];
  S.promptTemplate.forEach(it=>{
    if(it.type==='chat'||it.enabled===false) return;
    if(isEd(it)){
      itFields(it).forEach(f=>{
        if(it[f]&&it[f].length>0) parts.push(parseItemText(it[f]));
      });
    }
  });
  return parts.join('\n');
}

// Drag a divider to resize a panel. size(start, delta) returns the new px size.
function makeResizer(handle,target,axis,size){
  let g=false,start,base;
  const prop=axis==='x'?'width':'height',cur=axis==='x'?'col-resize':'row-resize';
  const pos=e=>axis==='x'?e.clientX:e.clientY;
  handle.addEventListener('mousedown',e=>{g=true;start=pos(e);base=axis==='x'?target.offsetWidth:target.offsetHeight;document.body.style.cursor=cur;e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(g)target.style[prop]=size(base,pos(e)-start)+'px';});
  document.addEventListener('mouseup',()=>{if(g){g=false;document.body.style.cursor='';}});
}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
makeResizer(_('vDiv'),_('rp'),'x',(w,d)=>clamp(w-d,180,900));

// ============================================================
// Prompt Navigator
// ============================================================
function isEd(it){return it.type==='plain'||it.type==='jailbreak'||it.type==='cot'||it.type==='chatML'||it.type==='persona'||it.type==='description'||it.type==='lorebook'||it.type==='postEverything'||it.type==='memory'||it.type==='authornote';}

// Which field holds the editable text for this item type?
function itFields(it){
  if(it.type==='plain'||it.type==='jailbreak'||it.type==='cot'||it.type==='chatML')return ['text'];
  if(it.type==='authornote')return ['innerFormat','defaultText'];
  if(it.type==='persona'||it.type==='description'||it.type==='lorebook'||it.type==='postEverything'||it.type==='memory')return ['innerFormat'];
  return [];
}
function itText(it,field){ return it[field||itFields(it)[0]]||''; }

function pLabel(it){
  if(it.name)return it.name;
  if(it.type==='plain'){if(it.type2==='main')return'Main Prompt';if(it.type2==='globalNote')return'Global Note';return'Plain';}
  if(it.type==='jailbreak')return'Jailbreak';if(it.type==='cot')return'Chain of Thought';
  if(it.type==='persona')return'Persona';if(it.type==='description')return'Description';
  if(it.type==='lorebook')return'Lorebook';if(it.type==='chat')return'Chat ['+(it.rangeStart??'')+'~'+(it.rangeEnd??'')+']';
  if(it.type==='authornote')return'Author Note';if(it.type==='memory')return'Memory';
  if(it.type==='postEverything')return'Post Everything';if(it.type==='chatML')return'ChatML';
  if(it.type==='cache')return'Cache';return it.type;
}

function renderNav(){
  if(!S.promptTemplate.length){navBody.innerHTML='<div style="color:var(--fg3);padding:8px;font-size:var(--us10);text-align:center;line-height:1.4">Import a preset to browse prompt items.</div>';return;}
  let h='';
  S.promptTemplate.forEach((it,i)=>{
    const e=isEd(it),a=i===S.activeIdx,t=it.type.toLowerCase().replace(/\s/g,'');
    h+='<div class="pi'+(a?' a':'')+(!e?' s':'')+'" draggable="true" data-idx="'+i+'"'+(e?' data-i="'+i+'"':'')+'>';
    h+='<span class="drag-handle" title="Drag to reorder">\u2630</span>';
    h+='<span class="ix">'+i+'</span><span class="pt '+t+'">'+escH(it.type)+'</span>';
    h+='<span class="pn">'+escH(pLabel(it))+'</span>';
    if(e){const tl=itFields(it).reduce((s,f)=>s+(it[f]?it[f].length:0),0);if(tl)h+='<span class="pm">'+(tl>999?Math.round(tl/1000)+'k':tl)+'</span>';}
    h+='</div>';
  });
  navBody.innerHTML=h;
  navBody.querySelectorAll('.pi[data-i]').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target.classList.contains('drag-handle'))return;
      const i=parseInt(el.dataset.i);saveEdit();
      S.activeIdx=i;S.mode='prompt';
      const it=S.promptTemplate[i];
      S.activeField=itFields(it)[0];
      ed.value=itText(it,S.activeField);
      crumb();update();renderNav();
    });
  });
  wireNavDrag();
}

function wireNavDrag(){
  let dragIdx=null;
  navBody.querySelectorAll('.pi[data-idx]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragIdx=parseInt(el.dataset.idx);
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      // Firefox requires data to be set
      e.dataTransfer.setData('text/plain',String(dragIdx));
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      navBody.querySelectorAll('.pi').forEach(x=>x.classList.remove('drop-above','drop-below'));
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const r=el.getBoundingClientRect();
      const below=e.clientY > r.top + r.height/2;
      navBody.querySelectorAll('.pi').forEach(x=>x.classList.remove('drop-above','drop-below'));
      el.classList.add(below?'drop-below':'drop-above');
    });
    el.addEventListener('drop',e=>{
      e.preventDefault();
      const targetIdx=parseInt(el.dataset.idx);
      const r=el.getBoundingClientRect();
      const below=e.clientY > r.top + r.height/2;
      let insertAt=below?targetIdx+1:targetIdx;
      if(dragIdx===null||dragIdx===targetIdx)return;
      reorderItem(dragIdx,insertAt);
      dragIdx=null;
    });
  });
}

function reorderItem(from,insertAt){
  saveEdit();markDirty();
  const arr=S.promptTemplate;
  const [moved]=arr.splice(from,1);
  // Adjust insertion index if we removed an earlier element
  if(from<insertAt)insertAt--;
  insertAt=Math.max(0,Math.min(arr.length,insertAt));
  arr.splice(insertAt,0,moved);
  // Keep the active item pointing at the same object
  if(S.activeIdx===from)S.activeIdx=insertAt;
  else if(S.activeIdx!==-1){
    // Recompute active index relative to the move
    const a=S.activeIdx;
    if(from<a&&insertAt>=a)S.activeIdx=a-1;
    else if(from>a&&insertAt<=a)S.activeIdx=a+1;
  }
  crumb();renderNav();renderPreviewContext();
  toast('Moved to position '+insertAt);
}

// Panel tab
// ============================================================
function applyPanel(txt){
  S.panelText=txt;S.panelParsed=parseControlPanel(txt);
  const fl=flattenPanelItems(S.panelParsed),nv={};
  for(const it of fl)nv[it.varname]=S.panelValues[it.varname]??(it.type==='text'?'':'0');
  S.panelValues=nv;
}

const panelRO=new ResizeObserver(es=>{for(const e of es)if(e.target.offsetHeight)S.panelHeight=e.target.offsetHeight;});
function renderPanel(){
  let h='<div class="sec"><div class="st" style="display:flex;align-items:center;gap:6px"><span>Custom Toggles</span><span style="flex:1"></span><button class="ref-btn" id="pRefBtn" title="Show Custom Toggles syntax">'+(S.panelRefOpen?'Hide':'Toggle Syntax')+'</button></div>';
  if(S.panelRefOpen)h+=panelSyntaxRef();
  const hStyle=S.panelHeight?' style="height:'+S.panelHeight+'px"':'';
  h+='<textarea class="cpta" id="pSrc"'+hStyle+' placeholder="Paste Custom Toggles...">'+escH(S.panelText)+'</textarea>';
  // Warnings
  const warns=S.panelParsed._warnings||[];
  if(warns.length){
    h+='<div class="warn-list">';
    warns.forEach(w=>{h+='<div class="w-item"><span class="w-ln">line '+w.line+'</span><span>'+escH(w.msg)+'</span></div>';});
    h+='</div>';
  }
  h+='<div style="margin-top:3px"><button class="sb ad" id="pApp">Apply</button></div></div>';
  if(S.panelParsed.length>0)h+=rPI(S.panelParsed);
  tc.panel.innerHTML=h;
  _('pApp')?.addEventListener('click',()=>{applyPanel(_('pSrc')?.value??'');markDirty();renderPanel();sched();});
  _('pRefBtn')?.addEventListener('click',()=>{S.panelRefOpen=!S.panelRefOpen;renderPanel();});
  // Persist textarea resize (ignore the 0 reported while the tab is hidden)
  panelRO.disconnect();
  const ta=_('pSrc');if(ta)panelRO.observe(ta);
  tc.panel.querySelectorAll('[data-cs]').forEach(s=>{s.addEventListener('change',e=>{S.panelValues[e.target.dataset.cs]=e.target.value;sched();});});
  tc.panel.querySelectorAll('[data-cx]').forEach(s=>{s.addEventListener('input',e=>{S.panelValues[e.target.dataset.cx]=e.target.value;sched();});});
  tc.panel.querySelectorAll('[data-ct]').forEach(b=>{
    b.addEventListener('click',e=>{const v=e.currentTarget.dataset.ct;S.panelValues[v]=S.panelValues[v]==='1'?'0':'1';e.currentTarget.classList.toggle('on',S.panelValues[v]==='1');sched();});
  });
}

function panelSyntaxRef(){
  return '<div class="ref-panel">'+
    '<h4>Format</h4>'+
    'Each line: <code>key=label=type=options</code>. Empty lines ignored. Type field is required for most items.'+
    '<h4>Toggle (default)</h4>'+
    '<span class="ex">myvar=My Label</span>'+
    'Creates an ON/OFF toggle. Stored as <code>toggle_myvar</code> in global variables.'+
    '<h4>Select</h4>'+
    '<span class="ex">myvar=My Label=select=opt1,opt2,opt3</span>'+
    'Creates a dropdown. Stored as 0-indexed string ("0", "1", "2").'+
    '<h4>Text input</h4>'+
    '<span class="ex">myvar=My Label=text</span>'+
    'Single-line text field. Use <code>textarea</code> for multi-line.'+
    '<h4>Group (collapsible section)</h4>'+
    '<span class="ex">=Group Title=group\nitem1=Item One\nitem2=Item Two\n=Group Title=groupEnd</span>'+
    '<span class="note">groupEnd is case-sensitive in RisuAI. "groupend" or "GROUPEND" will not close the group.</span>'+
    '<h4>Divider</h4>'+
    '<span class="ex">=Section Name=divider</span>'+
    '<h4>Caption (small text)</h4>'+
    '<span class="ex">=Some descriptive text=caption</span>'+
    '<h4>Usage in prompts (CBS)</h4>'+
    '<span class="ex">{{getglobalvar::toggle_myvar}}\n{{#if_pure {{getglobalvar::toggle_myvar}} }}...{{/if}}\n{{#when::toggle::myvar}}...{{/when}}\n{{#when::myvar::tis::1}}...{{/when}}</span>'+
    '<span class="note">toggle_ prefix is added automatically. Use the bare name in #when::toggle and #when::myvar::tis.</span>'+
  '</div>';
}

const REF_STATE = { active: null, query: '' };

function refMatch(entry, q) {
  if (!q) return true;
  const ql = q.toLowerCase();
  if (entry.name.toLowerCase().includes(ql)) return true;
  if (entry.sig && entry.sig.toLowerCase().includes(ql)) return true;
  if (entry.desc && entry.desc.toLowerCase().includes(ql)) return true;
  if (entry.aliases && entry.aliases.some(a => a.toLowerCase().includes(ql))) return true;
  if (entry.cat.toLowerCase().includes(ql)) return true;
  return false;
}

function refHighlight(text, q) {
  if (!q) return escH(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escH(text);
  return escH(text.substring(0, idx)) + '<span class="hit">' + escH(text.substring(idx, idx + q.length)) + '</span>' + escH(text.substring(idx + q.length));
}

function renderRefNav() {
  const nav = _('refNav');
  const q = REF_STATE.query;
  const filtered = REF_DATA.filter(e => refMatch(e, q));
  if (!filtered.length) {
    nav.innerHTML = '<div class="ref-empty">No matches.</div>';
    return;
  }
  // Auto-select first match if current selection isn't in filtered results
  if (!REF_STATE.active || !filtered.includes(REF_STATE.active)) {
    REF_STATE.active = filtered[0];
  }
  let h = '';
  let lastCat = '';
  filtered.forEach((e, i) => {
    if (e.cat !== lastCat) {
      h += '<div class="ref-cat">' + escH(e.cat) + '</div>';
      lastCat = e.cat;
    }
    const cls = e === REF_STATE.active ? 'ref-item active' : 'ref-item';
    h += '<div class="' + cls + '" data-rn="' + i + '">' + refHighlight(e.name, q) + '</div>';
  });
  nav.innerHTML = h;
  nav.querySelectorAll('.ref-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.rn);
      REF_STATE.active = filtered[idx];
      renderRefNav();
      renderRefContent();
    });
  });
}

function renderRefContent() {
  const c = _('refContent');
  const e = REF_STATE.active;
  if (!e) {
    c.innerHTML = '<div class="ref-empty">Select an entry from the left, or start typing in the search box.</div>';
    return;
  }
  let h = '<h2>' + escH(e.name) + '</h2>';
  h += '<div class="sig"><code class="inline">' + escH(e.sig || e.name) + '</code></div>';
  if (e.aliases && e.aliases.length) {
    h += '<div class="aliases">Aliases: ' + e.aliases.map(a => '<code>{{' + escH(a) + '}}</code>').join(', ') + '</div>';
  }
  if (e.desc) h += '<p>' + escH(e.desc) + '</p>';
  if (e.operators && e.operators.length) {
    h += '<div class="ex-label">Operators</div>';
    h += '<table style="border-collapse:collapse;margin:6px 0;font-size:calc(var(--pfs) - 1px)">';
    e.operators.forEach(([op, expl]) => {
      h += '<tr><td style="padding:2px 12px 2px 0;font-family:monospace;color:var(--purple);vertical-align:top"><code class="inline">' + escH(op) + '</code></td><td style="padding:2px 0;color:var(--fg)">' + escH(expl) + '</td></tr>';
    });
    h += '</table>';
  }
  if (e.examples && e.examples.length) {
    e.examples.forEach((ex, i) => {
      h += '<div class="ex-block">';
      h += '<div class="ex-label">Example' + (e.examples.length > 1 ? ' ' + (i + 1) : '') + '</div>';
      h += '<div class="ex-code">' + escH(ex.code) + '</div>';
      if (ex.out) h += '<div class="ex-out">' + escH(ex.out) + '</div>';
      h += '</div>';
    });
  }
  if (e.note) h += '<div class="note-box">' + escH(e.note) + '</div>';
  // Related (other entries in same category)
  const related = REF_DATA.filter(x => x.cat === e.cat && x !== e);
  if (related.length) {
    h += '<div class="related"><span style="margin-right:6px">See also:</span>';
    related.slice(0, 8).forEach(r => {
      h += '<a data-rrel="' + escH(r.name) + '">' + escH(r.name) + '</a>';
    });
    h += '</div>';
  }
  c.innerHTML = h;
  c.querySelectorAll('[data-rrel]').forEach(a => {
    a.addEventListener('click', () => {
      const target = REF_DATA.find(x => x.name === a.dataset.rrel);
      if (target) {
        REF_STATE.active = target;
        REF_STATE.query = '';
        _('refSearch').value = '';
        renderRefNav();
        renderRefContent();
        const activeEl = _('refNav').querySelector('.ref-item.active');
        if (activeEl) activeEl.scrollIntoView({block: 'nearest'});
      }
    });
  });
}

function toggleRefDrawer() {
  const open = _('drawer').style.display !== 'none';
  if (open) {
    _('drawer').style.display = 'none';
    _('drawerHD').style.display = 'none';
  } else {
    _('drawer').style.display = '';
    _('drawerHD').style.display = '';
    if (!REF_STATE.active) REF_STATE.active = REF_DATA[0];
    renderRefNav();
    renderRefContent();
    setTimeout(() => _('refSearch').focus(), 50);
  }
}

_('bRoll').addEventListener('click',()=>{
  S.rngSeed=(Math.random()*4294967296)>>>0;
  update();
  toast('Re-rolled randomness');
});
_('bRef').addEventListener('click', toggleRefDrawer);
_('bRefClose').addEventListener('click', toggleRefDrawer);
_('refSearch').addEventListener('input', e => {
  REF_STATE.query = e.target.value.trim();
  renderRefNav();
  renderRefContent();
});

// Drawer height drag
makeResizer(_('drawerHD'),_('drawer'),'y',(h,d)=>clamp(h-d,140,700));


function rPI(items){
  let h='';
  for(const it of items){
    if(it.type==='group'){h+='<div class="cpg"><div class="cpgt">'+escH(it.label)+'</div><div class="cpgb">'+rPI(it.items)+'</div></div>';}
    else if(it.type==='divider'){h+='<div class="cpd">'+escH(it.label)+'</div>';}
    else if(it.type==='caption'){h+='<div class="cpd" style="font-style:italic;opacity:.7">'+escH(it.label)+'</div>';}
    else if(it.type==='select'){
      h+='<div class="cpi"><span class="cpl">'+escH(it.label)+'</span><select class="cps" data-cs="'+escH(it.varname)+'">';
      it.options.forEach((o,i)=>{h+='<option value="'+i+'"'+(S.panelValues[it.varname]===String(i)?' selected':'')+'>'+escH(o)+'</option>';});
      h+='</select><span class="cpv">'+escH(S.panelValues[it.varname]??'0')+'</span></div>';
    }else if(it.type==='toggle'){
      const on=S.panelValues[it.varname]==='1';
      h+='<div class="cpi"><span class="cpl">'+escH(it.label)+'</span>';
      h+='<button class="ts '+(on?'on':'')+'" data-ct="'+escH(it.varname)+'"></button>';
      h+='<span class="cpv">'+(on?'1':'0')+'</span></div>';
    }else if(it.type==='text'){
      h+='<div class="cpi"><span class="cpl">'+escH(it.label)+'</span>';
      h+='<input class="ci" style="max-width:120px" value="'+escH(S.panelValues[it.varname]??'')+'" data-cx="'+escH(it.varname)+'" placeholder="...">';
      h+='</div>';
    }
  }
  return h;
}

// ============================================================
// Vars tab
// ============================================================
function renderVars(){
  let h='<div class="sec"><div class="st">Manual Variables</div>';
  S.manualVars.forEach((v,i)=>{
    h+='<div class="rw"><input class="ci" value="'+escH(v.key)+'" data-vt="k" data-vi="'+i+'" placeholder="name">';
    h+='<input class="ci" value="'+escH(v.value)+'" data-vt="v" data-vi="'+i+'" placeholder="value">';
    h+='<button class="sb d" data-vt="d" data-vi="'+i+'">&times;</button></div>';
  });
  h+='<button class="sb ad" data-vt="a">+ Variable</button></div>';
  h+='<div class="sec"><div class="st">Persona</div>';
  h+='<textarea class="ci" style="width:100%;height:40px;resize:vertical" data-vt="p" placeholder="User persona...">'+escH(S.persona)+'</textarea></div>';
  tc.vars.innerHTML=h;
}
tc.vars.addEventListener('click',e=>{
  const t=e.target.dataset.vt,i=parseInt(e.target.dataset.vi);
  if(t==='d'){S.manualVars.splice(i,1);renderVars();sched();}
  else if(t==='a'){S.manualVars.push({key:'',value:''});renderVars();}
});
tc.vars.addEventListener('input',e=>{
  const t=e.target.dataset.vt,i=parseInt(e.target.dataset.vi);
  if(t==='k'){S.manualVars[i].key=e.target.value;sched();}
  else if(t==='v'){S.manualVars[i].value=e.target.value;sched();}
  else if(t==='p'){S.persona=e.target.value;sched();}
});

// ============================================================
// State tab
// ============================================================
function renderState(){
  let h='<div class="sec"><div class="st">Variables (Post-Parse)</div><div class="ib">';
  const en=Object.entries(S.lastVars);
  if(!en.length)h+='<div style="color:var(--fg3);font-size:var(--us10)">None</div>';
  else en.forEach(([k,v])=>{h+='<div class="ir"><span class="ik">'+escH(k)+'</span><span class="iv">'+escH(String(v))+'</span></div>';});
  h+='</div></div>';

  h+='<div class="sec"><div class="st">Panel Values</div><div class="ib">';
  const pv=Object.entries(S.panelValues);
  if(!pv.length)h+='<div style="color:var(--fg3);font-size:var(--us10)">No panel</div>';
  else{const fl=flattenPanelItems(S.panelParsed);pv.forEach(([k,v])=>{
    const it=fl.find(f=>f.varname===k);let d=v;
    if(it?.type==='select'&&it.options[parseInt(v)])d=v+' ('+it.options[parseInt(v)]+')';
    else if(it?.type==='toggle')d=v==='1'?'ON':'OFF';
    h+='<div class="ir"><span class="ik">toggle_'+escH(k)+'</span><span class="iv">'+escH(d)+'</span></div>';
  });}
  h+='</div></div>';

  h+='<div class="sec"><div class="st">Parse</div><div class="ib">';
  const c=ed.value,n=(c.match(/\{\{/g)||[]).length;
  [['In',c.length+' ch'],['Out',prev.textContent.length+' ch'],['CBS',n],['Mode',S.mode+(S.activeIdx>=0?' #'+S.activeIdx:'')],['Status',S.parseErr?'Error':'OK']].forEach(([k,v])=>{
    h+='<div class="ir"><span class="ik">'+k+'</span><span class="iv"'+(k==='Status'?' style="color:'+(S.parseErr?'var(--err)':'var(--ok)')+'"':'')+'>'+v+'</span></div>';
  });
  h+='</div></div>';
  tc.state.innerHTML=h;
}

// ============================================================
// Init
// ============================================================
loadPrefs();update();renderNav();renderPanel();
